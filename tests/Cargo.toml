[package]
name = "hookpool-tests"
version = "0.1.0"
description = "LiteSVM integration tests for hookpool, the template hooks and the launchpad"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true, features = ["metadata"] }
hookpool = { path = "../programs/hookpool", features = ["no-entrypoint"] }
hooklaunch = { path = "../programs/hooklaunch", features = ["no-entrypoint"] }
hook_tax = { path = "../programs/hook_tax", features = ["no-entrypoint"] }
hook_launch_guard = { path = "../programs/hook_launch_guard", features = ["no-entrypoint"] }
hook_buyback = { path = "../programs/hook_buyback", features = ["no-entrypoint"] }
hook_collectible = { path = "../programs/hook_collectible", features = ["no-entrypoint"] }
hook_rules = { path = "../programs/hook_rules", features = ["no-entrypoint"] }
hook_evil = { path = "../programs/hook_evil", features = ["no-entrypoint"] }
hookpool-interface = { workspace = true }
litesvm = "0.10.0"
solana-account = "3.2"
solana-clock = "3.2"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-message = "3.0.1"
solana-transaction = "3.0"
solana-slot-hashes = "3.2"
solana-hash = "3.1"
solana-sha256-hasher = "3.1"
serde_json = "1"
base64 = "0.22"
