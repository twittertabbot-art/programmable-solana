[workspace]
members = ["programs/*"]
# tests/ is a project of its own (it runs on your machine, not on chain): see tests/Cargo.toml
exclude = ["tests"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.84.0"

[workspace.dependencies]
anchor-lang = { version = "1.2.0" }
# The interface crate is not on crates.io. Inside the Programmable repository this relative
# path finds it. Outside the repository, copy crates/hookpool-interface next to this file
# as vendor/hookpool-interface and write: { path = "vendor/hookpool-interface" }
hookpool-interface = { path = "../crates/hookpool-interface" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
