[package]
name = "hook_buyback"
version = "0.1.0"
description = "hookpool template: accrues quote fees, anyone triggers a buyback and burn through hook_swap"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "hook_buyback"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "hookpool/idl-build", "hookpool-interface/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
hookpool = { path = "../hookpool", features = ["cpi"] }
hookpool-interface = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
