<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Programmable mark candidates</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .panel { padding: 36px 40px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
  .dark { background: #0A0A0D; color: #9A9AA6; --accent: #FF2E8A; --tone: #F2F2F5; }
  .light { background: #F4F4F7; color: #5C5C68; --accent: #E0106F; --tone: #0E0E12; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .cell .big { width: 256px; height: 256px; }
  .cell .small { display: flex; gap: 14px; align-items: center; }
  .cell .small svg { width: 24px; height: 24px; }
  .cell .small .word { font-family: Syne, sans-serif; font-weight: 800; font-size: 20px; color: var(--tone); letter-spacing: -0.02em; display: inline-flex; align-items: center; gap: 8px; }
  .m-a { fill: var(--accent); } .s-a { stroke: var(--accent); } .m-t { fill: var(--tone); } .s-t { stroke: var(--tone); }
  .label { letter-spacing: 0.12em; text-transform: uppercase; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="mark-a" viewBox="0 0 64 64">
    <path class="m-a" d="M26 20C26 9 29 4 32 4s6 5 6 16v18H26z"/>
    <path class="s-t" d="M26 24h12" fill="none" stroke-width="2.4"/>
    <path class="s-a" d="M32 38v2a13 13 0 0 1-26 0v-7" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="s-a" d="M6 33v-8M6 30l6 5" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="mark-b" viewBox="0 0 64 64">
    <circle class="s-t" cx="32" cy="32" r="23" fill="none" stroke-width="5"/>
    <path class="s-t" d="M32 3v8M32 53v8M3 32h8M53 32h8" fill="none" stroke-width="5" stroke-linecap="round"/>
    <path class="s-a" d="M34 14v22a9 9 0 0 1-18 0v-5" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="s-a" d="M16 31v-6M16 28l5 4" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="mark-c" viewBox="0 0 64 64">
    <rect class="m-t" x="10" y="20" width="5" height="24" rx="1.5"/>
    <rect class="m-a" x="15" y="23" width="26" height="18" rx="2"/>
    <path class="m-a" d="M41 23h4c8 0 14 6 17 9-3 3-9 9-17 9h-4z"/>
    <path class="s-a" d="M12 6v40a8 8 0 0 0 16 0v-4" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="s-a" d="M28 42v-4M28 40l4 3" fill="none" stroke-width="4" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="panel dark">
  <div class="cell"><span class="label">a. bullet-hook</span><svg class="big"><use href="#mark-a"/></svg><div class="small"><svg><use href="#mark-a"/></svg><span class="word"><svg><use href="#mark-a"/></svg>Programmable</span></div></div>
  <div class="cell"><span class="label">b. crosshair-hook</span><svg class="big"><use href="#mark-b"/></svg><div class="small"><svg><use href="#mark-b"/></svg><span class="word"><svg><use href="#mark-b"/></svg>Programmable</span></div></div>
  <div class="cell"><span class="label">c. cartridge-hook</span><svg class="big"><use href="#mark-c"/></svg><div class="small"><svg><use href="#mark-c"/></svg><span class="word"><svg><use href="#mark-c"/></svg>Programmable</span></div></div>
</div>
<div class="panel light">
  <div class="cell"><span class="label">a. bullet-hook</span><svg class="big"><use href="#mark-a"/></svg><div class="small"><svg><use href="#mark-a"/></svg><span class="word"><svg><use href="#mark-a"/></svg>Programmable</span></div></div>
  <div class="cell"><span class="label">b. crosshair-hook</span><svg class="big"><use href="#mark-b"/></svg><div class="small"><svg><use href="#mark-b"/></svg><span class="word"><svg><use href="#mark-b"/></svg>Programmable</span></div></div>
  <div class="cell"><span class="label">c. cartridge-hook</span><svg class="big"><use href="#mark-c"/></svg><div class="small"><svg><use href="#mark-c"/></svg><span class="word"><svg><use href="#mark-c"/></svg>Programmable</span></div></div>
</div>
</body>
</html>
