<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch a token</title>
<meta name="description" content="Three ways to launch a coin: with modules you switch on, as a collectible, or on a hook somebody built.">
<script>
  // Links made for the earlier single form: launch.html?template=<name>, with &hook=<program id>
  // for a custom hook and &kind=pegged for a collectible. Each goes to the page that took its place.
  (function () {
    var q = new URLSearchParams(location.search), t = q.get("template");
    if (!t) return;
    var page = { rules: "launch-modules.html", none: "launch-modules.html", collectible: "launch-collectible.html", tax: "launch-hook.html", launch_guard: "launch-hook.html", buyback: "launch-hook.html", custom: "launch-hook.html" }[t];
    if (!page) return;
    var out = new URLSearchParams();
    if (t === "tax" || t === "launch_guard" || t === "buyback") out.set("hook", t);
    if (t === "custom" && q.get("hook")) out.set("hook", q.get("hook"));
    if (t === "collectible" && q.get("kind")) out.set("kind", q.get("kind"));
    if (q.get("cluster")) out.set("cluster", q.get("cluster"));
    var s = out.toString();
    location.replace(page + (s ? "?" + s : ""));
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34'/%3E%3Ccircle cx='17' cy='17' r='10' fill='none' stroke='%23F8F0E9' stroke-width='3.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header" id="siteHeader"></header>

<main class="wrap">
  <h1 class="sr-only">Launch a token</h1>
  <div class="choose" id="choose">
    <article class="choose-card" data-path="modules">
      <div class="choose-art" aria-hidden="true">
        <svg viewBox="0 0 200 120" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
          <path d="M22 26h64M22 60h84M22 94h50"/>
          <rect x="134" y="14" width="44" height="24" rx="12"/><circle cx="146" cy="26" r="5.5" fill="currentColor" stroke="none"/>
          <rect x="134" y="48" width="44" height="24" rx="12" fill="currentColor"/><circle cx="166" cy="60" r="5.5" fill="#000" stroke="none"/>
          <rect x="134" y="82" width="44" height="24" rx="12"/><circle cx="146" cy="94" r="5.5" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <div class="choose-body">
        <h2>Module Mode</h2>
        <p>Launch a coin and pick the modules it runs on every trade.</p>
        <a class="btn" href="launch-modules.html">Open Module Mode</a>
      </div>
    </article>
    <article class="choose-card" data-path="collectible">
      <div class="choose-art" aria-hidden="true">
        <svg viewBox="0 0 200 120" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round">
          <rect x="34" y="14" width="40" height="40" rx="7"/><rect x="80" y="14" width="40" height="40" rx="7" fill="currentColor"/><rect x="126" y="14" width="40" height="40" rx="7"/>
          <rect x="34" y="66" width="40" height="40" rx="7"/><rect x="80" y="66" width="40" height="40" rx="7"/><rect x="126" y="66" width="40" height="40" rx="7" stroke-dasharray="5 7"/>
        </svg>
      </div>
      <div class="choose-body">
        <h2>Collectible</h2>
        <p>Launch a coin whose buys earn pieces of a collection.</p>
        <a class="btn" href="launch-collectible.html">Open Collectible</a>
      </div>
    </article>
    <article class="choose-card" data-path="hook">
      <div class="choose-art" aria-hidden="true">
        <svg viewBox="0 0 200 120" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="34" cy="60" r="14"/><path d="M48 60h30M122 60h30"/><circle cx="166" cy="60" r="14" fill="currentColor"/>
          <rect x="78" y="38" width="44" height="44" rx="9"/><path d="M92 54l-6 6 6 6M108 54l6 6-6 6"/>
        </svg>
      </div>
      <div class="choose-body">
        <h2>Custom hook</h2>
        <p>Launch a coin on a hook somebody built, or on one of the platform's own.</p>
        <a class="btn" href="launch-hook.html">Open Custom hook</a>
      </div>
    </article>
  </div>
</main>

<footer class="site-footer" id="siteFooter"></footer>

<script type="module" src="launch.js"></script>
</body>
</html>
